name: "✨ Feature Request"
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before submitting, please consider:

        - Does this belong to DBclaw's database workflow scope, instead of general upstream Hermes capability work?
        - Search existing issues first — someone may already have proposed it.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What database workflow problem does this solve? What are you trying to do that you can't today?
      placeholder: |
        I'm trying to use DBclaw with [database/workflow/environment] but currently
        there's no way to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Be as specific as you can — pipeline behavior, UI behavior, config, SQL validation, approvals.
      placeholder: |
        Add a `--foo` flag to `dbclaw` that enables...
        Or: Add a config key `bar.baz` that controls...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why is the proposed solution better?

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      options:
        - SQL generation / intent routing
        - Safety pipeline / risk rule
        - Approval / audit / rollback
        - WebUI improvement
        - Configuration option
        - RAG / documentation enhancement
        - Developer experience (tests, docs, CI)
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How big is this change?
      options:
        - Small (single file, < 50 lines)
        - Medium (few files, < 300 lines)
        - Large (new module or significant refactor)

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself and submit a PR
