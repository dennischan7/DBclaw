name: "🐛 Bug Report"
description: Report a DBclaw bug — crash, incorrect behavior, release regression, or security issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a DBclaw bug. Please fill out the sections below so we can reproduce and fix it quickly.

        **Before submitting**, please:
        - [ ] Search existing issues to avoid duplicates
        - [ ] Confirm the bug still exists on the latest `v0.1.x` code or release tag

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what's broken. Include error messages, tracebacks, or screenshots if relevant.
      placeholder: |
        What happened? What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug. The more specific, the faster we can fix it.
      placeholder: |
        1. Run `hermes chat`
        2. Send the message "..."
        3. Agent calls tool X
        4. Error appears: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include full error output if available.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of DBclaw is affected?
      multiple: true
      options:
        - WebUI
        - DBA SafeGuard plugin
        - SQL generation / intent routing
        - Safety pipeline / risk control
        - Approval / audit / rollback
        - Memory / RAG / skills
        - CLI / local commands
        - Setup / Installation
        - Configuration (dba_config.yaml, .env, instance settings)
        - Security / secret handling
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Messaging Platform (if gateway-related)
      description: If your bug is gateway-related, select the affected platform.
      multiple: true
      options:
        - N/A (CLI only)
        - Telegram
        - Discord
        - Slack
        - WhatsApp

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. Ubuntu 24.04, macOS 15.2, Windows 11
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "3.11.9"
    validations:
      required: true

  - type: input
    id: hermes-version
    attributes:
      label: DBclaw Version
      description: Release tag, branch, or commit SHA
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: textarea
    id: security-impact
    attributes:
      label: Security Impact (optional)
      description: If the bug may expose credentials, bypass approvals, or allow dangerous SQL, explain that here.
      placeholder: |
        Example: This bypasses approval checks for UPDATE statements in moderate mode.

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Traceback
      description: Paste any error output, traceback, or log messages. This will be auto-formatted as code.
      render: shell

  - type: textarea
    id: root-cause
    attributes:
      label: Root Cause Analysis (optional)
      description: |
        If you've dug into the code and identified the root cause, share it here.
        Include file paths, line numbers, and code snippets if possible. This massively speeds up fixes.
      placeholder: |
        The bug is in `gateway/run.py` line 949. `len(history)` counts session_meta entries
        but `agent_messages` was built from filtered history...

  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed Fix (optional)
      description: If you have a fix in mind (or a PR ready), describe it here.
      placeholder: |
        Replace `.get()` with `.pop()` on line 289 of `gateway/platforms/base.py`
        to actually clear the pending message after retrieval.

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Are you willing to submit a PR for this?
      options:
        - label: I'd like to fix this myself and submit a PR
