model:
  provider: openai-compatible
  model_name: qwen3.6-flash
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
settings:
  default_dialect: postgresql
  default_role: editor
  connection_timeout: 30
  execution_timeout: 60
  audit_retention_days: 0
  enable_l4_memory: true
  library_root: library
databases:
  instances:
  - name: pg_test
    type: postgresql
    host: localhost
    port: 5437
    database: health_db_kimi
    readonly_user_env: DBA_PG_TEST_RO_USER
    readonly_pass_env: DBA_PG_TEST_RO_PASS
    admin_user_env: DBA_PG_TEST_ADMIN_USER
    admin_pass_env: DBA_PG_TEST_ADMIN_PASS
    timeout: 30
roles:
  viewer:
    description: 只读查阅 — 仅可执行L0操作
    max_risk_level: 0
  editor:
    description: 编辑者 — 可执行L0-L2操作
    max_risk_level: 2
  admin:
    description: 管理员 — 全权限L0-L4
    max_risk_level: 4
